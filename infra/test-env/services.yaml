# Test-only services for the local integration suite. Every credential below
# is a fixed, test-only value for loopback-bound disposable stores; none is
# used anywhere else. All state is ephemeral: restarting a pod resets it.
apiVersion: v1
kind: Namespace
metadata: {name: sova-test-env}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: sova-test-env}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17.11
          # wal_level=logical: the logical-replication tests. The server listens on
          # the same port inside the pod as the tests use on the host, so a
          # subscription can reach its publisher at the address the tests know.
          args: ["-c", "cluster_name=sova-persistence-test", "-c", "max_prepared_transactions=8",
                 "-c", "port=55432",
                 "-c", "wal_level=logical", "-c", "max_replication_slots=32",
                 "-c", "max_wal_senders=32", "-c", "max_logical_replication_workers=16",
                 "-c", "max_worker_processes=32", "-c", "max_slot_wal_keep_size=1GB"]
          env:
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
            - {name: POSTGRES_DB, value: sova_test}
            - {name: PGPORT, value: "55432"}  # psql, pg_dump and the server itself
          ports: [{containerPort: 55432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "sova_test"]}
            periodSeconds: 2
          resources: {limits: {memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: sova-test-env}
spec:
  type: NodePort
  selector: {app: postgres}
  ports: [{port: 55432, targetPort: 55432, nodePort: 30432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3-source, namespace: sova-test-env}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: s3-source}}
  template:
    metadata: {labels: {app: s3-source}}
    spec:
      containers:
        - name: gateway
          image: versity/versitygw:v1.10.0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /data /versions /iam
              versitygw --iam-dir /iam posix --versioning-dir /versions /data &
              gateway=$!
              # Any HTTP answer (an unauthenticated request is refused) means it is up.
              until wget -S -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q "HTTP/"; do
                sleep 0.5
              done
              for u in appuser batchuser platformuser; do
                versitygw admin -a sovaroot -s sova-root-test-secret \
                  --er http://127.0.0.1:7070 create-user --access "$u" --secret "$u-test-secret" --role user
              done
              touch /tmp/ready
              wait "$gateway"
          env:
            - {name: ROOT_ACCESS_KEY_ID, value: sovaroot}
            - {name: ROOT_SECRET_ACCESS_KEY, value: sova-root-test-secret}
          ports: [{containerPort: 7070}]
          readinessProbe:
            exec: {command: ["test", "-f", "/tmp/ready"]}
            periodSeconds: 2
          resources: {limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: s3-source, namespace: sova-test-env}
spec:
  type: NodePort
  selector: {app: s3-source}
  ports: [{port: 7070, targetPort: 7070, nodePort: 30070}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: s3-target, namespace: sova-test-env}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: s3-target}}
  template:
    metadata: {labels: {app: s3-target}}
    spec:
      containers:
        - name: gateway
          image: versity/versitygw:v1.10.0
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /data /versions /iam
              versitygw --iam-dir /iam posix --versioning-dir /versions /data &
              gateway=$!
              # Any HTTP answer (an unauthenticated request is refused) means it is up.
              until wget -S -O /dev/null http://127.0.0.1:7070/ 2>&1 | grep -q "HTTP/"; do
                sleep 0.5
              done
              for u in appuser batchuser platformuser; do
                versitygw admin -a sovaroot -s sova-root-test-secret \
                  --er http://127.0.0.1:7070 create-user --access "$u" --secret "$u-test-secret" --role user
              done
              touch /tmp/ready
              wait "$gateway"
          env:
            - {name: ROOT_ACCESS_KEY_ID, value: sovaroot}
            - {name: ROOT_SECRET_ACCESS_KEY, value: sova-root-test-secret}
          ports: [{containerPort: 7070}]
          readinessProbe:
