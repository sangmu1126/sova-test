          resources: {limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: s3-target, namespace: sova-test-env}
spec:
  type: NodePort
  selector: {app: s3-target}
  ports: [{port: 7070, targetPort: 7070, nodePort: 30071}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: keycloak-source, namespace: sova-test-env}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: keycloak-source}}
  template:
    metadata: {labels: {app: keycloak-source}}
    spec:
      containers:
        - name: keycloak
          image: keycloak/keycloak:26.8.1
          args: ["start-dev", "--http-port=8080"]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: sova-admin}
            - {name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: sova-admin-test-secret}
            # Tokens name the issuer the host sees, so tests compare it exactly.
            - {name: KC_HOSTNAME, value: "http://127.0.0.1:58080"}
            - {name: JAVA_OPTS_KC_HEAP, value: "-Xms128m -Xmx512m"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /realms/master/.well-known/openid-configuration, port: 8080}
            periodSeconds: 3
          resources: {limits: {memory: 900Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: keycloak-source, namespace: sova-test-env}
spec:
  type: NodePort
  selector: {app: keycloak-source}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30080}]
