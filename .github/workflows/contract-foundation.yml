name: contract-foundation
on:
  push:
    branches: [main, feature/contract-driven-foundation, feature/migration-request-qualification]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.14']
    env:
      UV_PYTHON_DOWNLOADS: 'never'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select the existing pinned security source
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          value = json.loads(pathlib.Path('integration/security/manifest.json').read_text())
          source = value['qualified_package_source']
          assert type(source) is str and re.fullmatch(r'[0-9a-f]{40}', source)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('SECURITY_COMMIT=' + source + '\n')
          PY
      - name: Read the immutable producer from the personal security repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sangmu1126/security
          ref: ${{ env.SECURITY_COMMIT }}
          path: .local-notes/security-source
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Prepare the consumer's locked test dependencies
        run: >-
          uv sync --locked --group ci --extra dev --extra service --extra observability
          --no-install-project --no-install-package sova-security --no-build
          --python '${{ matrix.python }}'
      - name: Verify that lock and imported producer match the immutable contract
        run: |
          python3 - <<'PY'
          import json, pathlib, tomllib
          source = json.loads(pathlib.Path('integration/security/manifest.json').read_text())['qualified_package_source']
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          locked = tomllib.loads(pathlib.Path('uv.lock').read_text())
          assert project['tool']['uv']['sources']['sova-security'] == {
              'git': 'https://github.com/sangmu1126/security.git', 'rev': source}
          producer = [p for p in locked['package'] if p['name'] == 'sova-security']
          assert len(producer) == 1 and producer[0]['source'] == {
              'git': f'https://github.com/sangmu1126/security.git?rev={source}#{source}'}
          PY
      - name: Check domain layering and acceptance boundaries without cloud credentials
        env:
          PYTHONPATH: '${{ github.workspace }}/src:${{ github.workspace }}/.local-notes/security-source/src'
        run: |
          PYTHON="$PWD/.venv/bin/python"
          "$PYTHON" -m ruff check src tests
          "$PYTHON" -m pytest -q tests/unit -rs
          "$PYTHON" - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('docs/specifications')
          manifest = json.loads((root / 'manifest.json').read_text())
          raw = (root / manifest['file']).read_bytes()
          assert len(raw) == manifest['bytes']
          assert hashlib.sha256(raw).hexdigest() == manifest['sha256']
          PY
  console-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install the locked console without dependency lifecycle scripts
        working-directory: console
        run: npm ci --ignore-scripts
      - name: Verify the console types, behavior and production bundle
        working-directory: console
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run format:check
