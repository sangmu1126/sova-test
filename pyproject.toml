[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sova-control-plane"
version = "0.1.0"
description = "Contracts and execution boundaries for evidence-driven environment migration"
requires-python = ">=3.11"
dependencies = ["sova-security==0.11.1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
security = ["cryptography>=46,<51"]
aws = ["boto3>=1.35,<2"]
gcp = ["google-auth>=2.30,<3", "requests>=2.32,<3"]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4", "cryptography>=46,<51"]
s3 = ["boto3>=1.35,<2"]
mysql = ["PyMySQL>=1.1,<2"]
rabbitmq = ["pika>=1.3,<2", "httpx>=0.27,<1"]
kafka = ["confluent-kafka>=2.5,<3", "httpx>=0.27,<1"]
redis = ["redis>=8.1,<9"]
mongodb = ["pymongo>=4.19,<5"]
keycloak = ["httpx>=0.27,<1", "cryptography>=46,<51"]
preview = ["boto3>=1.35,<2"]
observability = ["opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
demo = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "httpx>=0.27,<1", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.18", "psycopg[binary]>=3.2,<4", "boto3>=1.35,<2", "cryptography>=46,<51", "PyMySQL>=1.1,<2", "pika>=1.3,<2", "confluent-kafka>=2.5,<3", "redis>=8.1,<9", "pymongo>=4.19,<5"]

[project.scripts]
sova = "sova.interfaces.cli:main"
sova-service = "sova.service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sova.adapters" = ["sql/*.sql"]
"sova.security.adapters" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo"]
pythonpath = [".", "src", "demo", "tests"]
markers = ["postgres: requires an explicitly isolated Sova PostgreSQL test cluster", "s3: requires disposable loopback S3-compatible stores", "keycloak: requires two disposable loopback Keycloak servers", "kubernetes: requires a disposable loopback kind cluster", "aws_live: creates and deletes run-scoped resources in a real AWS account (opt-in)", "gcp_live: creates and deletes run-scoped resources in a real Google Cloud project (opt-in)", "perf: handoff measurements (opt-in, SOVA_TEST_PERF=1)", "postgres_tls: needs a certificate-verified TLS (or private Unix socket) PostgreSQL", "policy_engine: requires explicitly pinned OPA binary", "mysql: requires the disposable loopback MySQL server", "rabbitmq: requires the disposable loopback RabbitMQ server", "kafka: requires the disposable loopback Kafka-API (Redpanda) server", "redis: requires the disposable Redis-protocol (Valkey) servers on the kind cluster", "mongodb: requires the disposable MongoDB servers on the kind cluster"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"infra/eks-rke2/setup_control.py" = ["E402"] # Reuses the source-checkout demo setup.
"infra/eks-rke2/qualify_route.py" = ["E402"] # Local validation imports the fixed demo bridge.

"demo/server.py" = ["E402"]
"demo/graph_demo.py" = ["E402"]
"demo/security_console.py" = ["E402"]
"demo/relocation_server.py" = ["E402"]

# CI imports this exact producer checkout; never resolve sova-security by name alone.
[tool.uv.sources]
sova-security = { git = "https://github.com/sangmu1126/security.git", rev = "27e6e85514a7cbb3e43d216464b72d9bd78f3fcf" }

[dependency-groups]
ci = ["sova-security[dev,platform-test]==0.11.1"]
