[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sova-control-plane"
version = "0.1.0"
description = "Contracts and execution boundaries for evidence-driven environment migration"
requires-python = ">=3.11"
dependencies = ["sova-security==0.11.1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
security = ["cryptography>=46,<51"]
aws = ["boto3>=1.35,<2"]
s3 = ["boto3>=1.35,<2"]
keycloak = ["httpx>=0.27,<1", "cryptography>=46,<51"]
preview = ["boto3>=1.35,<2"]
observability = ["opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
demo = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "httpx>=0.27,<1", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.18", "psycopg[binary]>=3.2,<4", "boto3>=1.35,<2", "cryptography>=46,<51"]

[project.scripts]
sova = "sova.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sova.adapters" = ["sql/*.sql"]
"sova.security.adapters" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo"]
pythonpath = [".", "src", "demo", "tests"]
markers = ["postgres: requires an explicitly isolated Sova PostgreSQL test cluster", "s3: requires disposable loopback S3-compatible stores", "keycloak: requires two disposable loopback Keycloak servers", "kubernetes: requires a disposable loopback kind cluster", "policy_engine: requires explicitly pinned OPA binary"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"infra/eks-rke2/setup_control.py" = ["E402"] # Reuses the source-checkout demo setup.
"infra/eks-rke2/qualify_route.py" = ["E402"] # Local validation imports the fixed demo bridge.

"demo/server.py" = ["E402"]
"demo/graph_demo.py" = ["E402"]
"demo/security_console.py" = ["E402"]
"demo/relocation_server.py" = ["E402"]
