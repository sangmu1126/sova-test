# The API needs no Kubernetes access; its token is not even mounted.
apiVersion: v1
kind: ServiceAccount
metadata: {name: sova-api}
automountServiceAccountToken: false
---
# The worker reads pods of its own namespace (is a lost worker gone?) and,
# where application owners grant it, the route Service of their namespace.
apiVersion: v1
kind: ServiceAccount
metadata: {name: sova-worker}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: sova-migrate}
automountServiceAccountToken: false
