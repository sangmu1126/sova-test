# Nothing reaches a Sova pod except the API port. (Kubelet probes are always
# allowed.) Egress depends on where the database, the identity provider, the
# witness store and the applications are; overlays add it per environment.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sova-default-deny-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: sova-api-ingress}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: sova-api}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
