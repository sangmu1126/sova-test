# Handoff workers. Any number may run: each handoff is held by one worker at
# a time through its execution lease, the others skip it.
#
# Exactly one worker container per pod. A worker's owner ID is
# <pod name>.<pod uid>.<process instance> (downward API + a value new at
# every start); a successor proves a lost worker gone either because the API
# no longer has that pod, or because the holder was an earlier container of
# its own pod (the kubelet restarts a container only after it stopped).
#
# SIGTERM: finish the current step, release the lease, exit; another replica
# continues at the next step without recovery. A step still running at the
# end of the grace period is killed and recovered by readback, never re-run.
apiVersion: apps/v1
kind: Deployment
metadata: {name: sova-worker}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: sova-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sova-worker, app.kubernetes.io/component: worker}
    spec:
      serviceAccountName: sova-worker
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: sova-worker}}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: sova-worker}}
      containers:
        - name: worker
          image: sova-service
          args: [run-worker, --health-port, "8081"]
          ports: [{name: health, containerPort: 8081}]
          envFrom: [{configMapRef: {name: sova-config}}]
          env:
            - {name: SOVA_DATABASE_URL_FILE, value: /etc/sova/database/runtime-dsn}
            - {name: SOVA_WITNESS_S3_FILE, value: /etc/sova/witness/config.json}
            - {name: SOVA_EVIDENCE_KEY_FILE, value: /etc/sova/evidence/key}
            - {name: SOVA_EXECUTION_FILE, value: /etc/sova/execution/execution.json}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          livenessProbe:  # fails once no poll or step boundary for SOVA_WORKER_STALL_SECONDS
            httpGet: {path: /healthz, port: health}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: database, mountPath: /etc/sova/database, readOnly: true}
            - {name: witness, mountPath: /etc/sova/witness, readOnly: true}
            - {name: evidence, mountPath: /etc/sova/evidence, readOnly: true}
            - {name: execution, mountPath: /etc/sova/execution, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: database
          secret:
            secretName: sova-database
            defaultMode: 0440
            items: [{key: runtime-dsn, path: runtime-dsn}]
        - name: witness
          secret: {secretName: sova-witness, defaultMode: 0440}
        - name: evidence
          secret:
            secretName: sova-worker-evidence
            defaultMode: 0440
            items: [{key: key, path: key}]
        - name: execution
          secret: {secretName: sova-execution, defaultMode: 0440}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: sova-worker}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sova-worker}
