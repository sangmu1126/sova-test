# The Sova control plane, environment-neutral. An overlay sets the namespace,
# the image (by digest in production), the configuration values and the
# migration Job's release suffix; the Secrets listed in README.md are created
# by the operator and never kept in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: sova}
resources:
  - serviceaccounts.yaml
  - rbac.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - network-policy.yaml
configMapGenerator:
  - name: sova-config
    literals:
      - SOVA_OIDC_AUDIENCE=sova-api
      - SOVA_TENANT_CLAIM=sova_tenant
      - SOVA_ROLES_CLAIM=realm_access.roles
      - "SOVA_ROLE_PREFIX=sova:"
      - SOVA_REGISTRY_VERIFIER_VERSION=registry-attestor-1
      - SOVA_EVIDENCE_VERIFIER=handoff-verifier-1
      - SOVA_EVIDENCE_ISSUER=handoff-producer
      - SOVA_EVIDENCE_KEY_ID=k1
      - SOVA_RUNTIME_ROLE=sova_runtime
      - SOVA_LEASE_SECONDS=120
      - SOVA_WORKER_STALL_SECONDS=600
      - SOVA_LOG_LEVEL=INFO
