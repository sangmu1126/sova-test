# A worker proves another worker is gone by reading its pod (name and UID).
# Nothing else in this namespace; route rights live in each application's
# namespace (README.md: "Granting a route").
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: sova-worker-pods}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: sova-worker-pods}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: sova-worker-pods}
subjects:
  - {kind: ServiceAccount, name: sova-worker}
