<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1790" viewBox="0 0 1800 1790" role="img" aria-labelledby="title desc"><title id="title">T19  移行元照合ゲート · 証跡から切り替えの前提条件まで</title><desc id="desc">LLMを使わずルールで判定する。判定PASSと本番実行の承認を分離する。</desc><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#3769e8"/></marker><marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#15845b"/></marker><marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#a56512"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans KR',sans-serif;fill:#172b4d}.title{font-size:43px;font-weight:750;letter-spacing:-1px}.sub{font-size:22px;fill:#62758f}.head{font-size:28px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#62758f}.label{font-size:19px;font-weight:650;fill:#3769e8}.step{font-size:17px;letter-spacing:2px;font-weight:700;fill:#62758f}</style><rect width="1800" height="1790" fill="#fbfcff"/><text x="70" y="80" class="title">T19  移行元照合ゲート · 証跡から切り替えの前提条件まで</text><text x="70" y="125" class="sub">LLMを使わずルールで判定する。判定PASSと本番実行の承認を分離する。</text><rect x="70" y="180" width="470" height="150" rx="18" fill="#f4f6fa" stroke="#d8e1ee" stroke-width="2"/><text x="95" y="222" class="head">T14 · 移行元ControlRun</text><text x="95" y="266" class="body">実行結果・証跡参照</text><text x="95" y="301" class="body">原本ハッシュ・手法・観測時刻</text><rect x="585" y="180" width="630" height="150" rx="18" fill="#f4f6fa" stroke="#d8e1ee" stroke-width="2"/><text x="610" y="222" class="head">T10 · 現在の計画とサーバー正本</text><text x="610" y="266" class="body">アプリ・環境ペア・評価プロファイル・計画ハッシュ</text><text x="610" y="301" class="body">現在の権限・登録・例外承認・セキュリティ保留</text><rect x="1260" y="180" width="470" height="150" rx="18" fill="#f4f6fa" stroke="#d8e1ee" stroke-width="2"/><text x="1285" y="222" class="head">T14 · 移行先ControlRun</text><text x="1285" y="266" class="body">実行結果・証跡参照</text><text x="1285" y="301" class="body">原本ハッシュ・手法・観測時刻</text><path d="M305 330 V360 H900 V395" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><path d="M900 330 V395" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><path d="M1495 330 V360 H900" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="395" width="1540" height="155" rx="18" fill="#f1f5ff" stroke="#3769e8" stroke-width="2"/><text x="160" y="436" class="step">01  証跡の有効性・結び付きを検証</text><text x="160" y="478" class="head">出所・署名 · 同一アプリ・環境ペア · 計画・結果ハッシュ · 現在の権限・期限</text><text x="160" y="520" class="body">必須試験の欠落・重複、期待値変更、手法不一致、期限切れ、別計画の結果はBLOCK</text><path d="M900 550 V605" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="605" width="960" height="270" rx="18" fill="#fff" stroke="#3769e8" stroke-width="2"/><text x="160" y="649" class="head">02  試験ごとに保護水準を比較</text><text x="165" y="693" class="body">移行元</text><text x="495" y="693" class="body">移行先</text><text x="760" y="693" class="body">判定</text><text x="165" y="738" class="body">PASS</text><text x="495" y="738" class="body">PASS</text><text x="760" y="738" class="body">PASS</text><text x="165" y="778" class="body">FAIL</text><text x="495" y="778" class="body">PASS</text><text x="760" y="778" class="body">PASS · 改善</text><text x="165" y="818" class="body">PASS / FAIL</text><text x="495" y="818" class="body">FAIL</text><text x="760" y="818" class="body">BLOCK</text><text x="165" y="858" class="body">いずれかがUNKNOWN</text><text x="495" y="858" class="body">—</text><text x="760" y="858" class="body">BLOCK</text><rect x="1160" y="605" width="510" height="270" rx="18" fill="#fff8ec" stroke="#ebc98e" stroke-width="2"/><text x="1190" y="649" class="head">サーバーの例外承認を検証</text><text x="1190" y="694" class="body">TARGET_FAILの行にのみ適用</text><text x="1190" y="729" class="body">承認ID・計画・試験・環境を照合</text><text x="1190" y="764" class="body">現在の権限・期間・取消状態を確認</text><text x="1190" y="799" class="body">UNKNOWN・証跡エラーは例外不可</text><text x="1190" y="834" class="body">例外は同等性のPASSと区別して表示</text><path d="M1090 740 H1160" fill="none" stroke="#a56512" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#amber)"/><path d="M900 875 V925" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="925" width="1540" height="145" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2"/><text x="160" y="967" class="step">03  T13のデータ準備状態と結合</text><text x="160" y="1010" class="head">スキーマ・PK · 複製遅延 · シーケンスのリハーサル · 正確なDBペア・鮮度</text><text x="160" y="1047" class="small">T19の準備判定は、T12/T13の書き込み停止後の最終データ比較を代替しない。</text><path d="M900 1070 V1120" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="1120" width="1540" height="140" rx="18" fill="#f1f5ff" stroke="#3769e8" stroke-width="2"/><text x="160" y="1161" class="step">04  結果を実際に利用する直前に再確認</text><text x="160" y="1203" class="head">サーバー正本を再取得 · 現在の承認・権限・鍵失効 · 証跡・署名の期限</text><text x="160" y="1239" class="small">過去のPASSを再利用しない · 取得失敗・変更・状態不明の場合は前提条件を発行しない</text><path d="M620 1260 V1310 H480 V1345" fill="none" stroke="#15845b" stroke-width="3" marker-end="url(#green)"/><path d="M1180 1260 V1310 H1320 V1345" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="1345" width="700" height="160" rx="18" fill="#eaf7f1" stroke="#a9d5c2" stroke-width="2"/><text x="160" y="1388" class="head" style="fill:#15845b">前提条件を充足</text><text x="160" y="1430" class="body">セキュリティとデータ準備の両方を確認</text><text x="160" y="1468" class="small">authorizes_cutover = False · 実行許可ではない</text><rect x="970" y="1345" width="700" height="160" rx="18" fill="#fff0f3" stroke="#e5b8c1" stroke-width="2"/><text x="1000" y="1388" class="head" style="fill:#bd4058">BLOCK · ホスト側で保留</text><text x="1000" y="1430" class="body">不一致・未確認・期限切れ・権限の問題</text><text x="1000" y="1468" class="small">修正・新規観測・再検証が必要 · 過去のPASSで代替しない</text><path d="M480 1505 V1555 H900 V1590" fill="none" stroke="#15845b" stroke-width="3" marker-end="url(#green)"/><rect x="130" y="1590" width="1540" height="110" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2"/><text x="160" y="1635" class="head">T10 · 現在の本番承認・保留・実行epochを同じ計画ロック内で結合</text><text x="160" y="1675" class="small">必須条件をすべて満たす場合のみT12/T31の実行を受け付ける · T19は直接デプロイ・書き込み再開を行わない</text><text x="70" y="1750" class="small">実装構造 · 実環境の公開バケットをBLOCK · スキーマ不一致のBLOCK・修正後PASSの受入検証は別途</text></svg>