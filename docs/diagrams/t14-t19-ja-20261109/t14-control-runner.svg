<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460" role="img" aria-labelledby="title desc"><title id="title">T14  セキュリティ統制試験 · 観測から証跡まで</title><desc id="desc">AWS EKSとオンプレミスRKE2を、共通の試験ID・合格基準で検査する。</desc><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#3769e8"/></marker><marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#15845b"/></marker><marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#a56512"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans KR',sans-serif;fill:#172b4d}.title{font-size:43px;font-weight:750;letter-spacing:-1px}.sub{font-size:22px;fill:#62758f}.head{font-size:28px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#62758f}.label{font-size:19px;font-weight:650;fill:#3769e8}.step{font-size:17px;letter-spacing:2px;font-weight:700;fill:#62758f}</style><rect width="1800" height="1460" fill="#fbfcff"/><text x="70" y="80" class="title">T14  セキュリティ統制試験 · 観測から証跡まで</text><text x="70" y="125" class="sub">AWS EKSとオンプレミスRKE2を、共通の試験ID・合格基準で検査する。</text><rect x="70" y="175" width="1660" height="115" rx="18" fill="#f4f6fa" stroke="#d8e1ee" stroke-width="2"/><text x="100" y="215" class="step">INPUT  ·  T5の試験契約 + T10の現在の登録情報</text><text x="100" y="255" class="body">評価プロファイル・必須試験・手法バージョン / アプリ・環境・リソース・実行主体・許可範囲</text><path d="M900 290 V340" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="280" y="340" width="1240" height="145" rx="18" fill="#f1f5ff" stroke="#3769e8" stroke-width="2"/><text x="310" y="381" class="step">01  サーバーに登録された試験を実行</text><text x="310" y="423" class="head">Runner · 共通の実行・結果契約</text><text x="310" y="461" class="body">実行IDを生成 · 登録との一致を確認 · 信頼済みアダプターを選択 · 時間・対象範囲を制限</text><path d="M610 485 V525 H460 V565" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><path d="M1190 485 V525 H1340 V565" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><text x="72" y="535" class="label">試験要求</text><rect x="70" y="565" width="780" height="310" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2" stroke-dasharray="9 7"/><text x="100" y="605" class="step">AWS / SOURCE</text><text x="100" y="649" class="head">移行元 · AWS EKS</text><path d="M100 670 H820" stroke="#d8e1ee"/><text x="100" y="715" class="body">Secretアクセス：Secrets Manager + ロール照合</text><text x="100" y="753" class="body">オブジェクトアクセス：S3の正規・匿名GET</text><text x="100" y="791" class="body">TLS・ネットワーク：PgBouncer / PostgreSQL</text><text x="100" y="829" class="body">監査：登録済みログソースでカナリアを検索</text><rect x="950" y="565" width="780" height="310" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2" stroke-dasharray="9 7"/><text x="980" y="605" class="step">ON-PREMISES / TARGET</text><text x="980" y="649" class="head">移行先 · オンプレミスRKE2</text><path d="M980 670 H1700" stroke="#d8e1ee"/><text x="980" y="715" class="body">Secretアクセス：OpenBao + サービスアカウント照合</text><text x="980" y="753" class="body">オブジェクトアクセス：SeaweedFSの正規・匿名GET</text><text x="980" y="791" class="body">TLS・ネットワーク：PgBouncer / PostgreSQL</text><text x="980" y="829" class="body">監査：登録済みログソースでカナリアを検索</text><path d="M460 875 V915 H900 V960" fill="none" stroke="#15845b" stroke-width="3" marker-end="url(#green)"/><path d="M1340 875 V915 H900" fill="none" stroke="#15845b" stroke-width="3" marker-end="url(#green)"/><text x="1120" y="943" class="small">観測結果 + 正常系の対照試験</text><rect x="160" y="960" width="1480" height="135" rx="18" fill="#f1f5ff" stroke="#3769e8" stroke-width="2"/><text x="190" y="1001" class="step">02  共通ルールで結果を判定</text><text x="190" y="1045" class="head">PASS：期待と一致   FAIL：期待と不一致   UNKNOWN：未実行・観測不可</text><text x="190" y="1079" class="small">対照試験の失敗・未登録ツール・エラー・タイムアウトをPASSにしない。</text><path d="M900 1095 V1145" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="160" y="1145" width="1480" height="135" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2"/><text x="190" y="1186" class="step">03  ControlRun + 証跡原本を保存</text><text x="190" y="1228" class="body">試験ID · 観測値 · 手法 · 時刻・有効期限 · 原本ハッシュ · アプリ・環境・実行ID</text><text x="190" y="1264" class="small">ホストがアクセス制御された保存先に保管し、シークレット値を結果に残さない。</text><path d="M900 1280 V1325" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="510" y="1325" width="780" height="60" rx="18" fill="#eaf7f1" stroke="#b5dccb" stroke-width="2"/><text x="900" y="1363" class="body" text-anchor="middle">T19に不変の結果参照を渡す → 両環境を比較・判定</text><text x="70" y="1421" class="small">実装構造 · アダプター別の実環境検証範囲は別表参照 · 20行の生成 ≠ 20試験の実施</text></svg>