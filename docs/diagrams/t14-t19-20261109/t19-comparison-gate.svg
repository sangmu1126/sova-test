<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1790" viewBox="0 0 1800 1790" role="img" aria-labelledby="title desc"><title id="title">T19  원본 대조 게이트 · 증거에서 전환 전제조건까지</title><desc id="desc">LLM 없이 규칙으로 판정한다. 결과 PASS와 운영 실행 승인은 분리한다.</desc><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#3769e8"/></marker><marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#15845b"/></marker><marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#a56512"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172b4d}.title{font-size:43px;font-weight:750;letter-spacing:-1px}.sub{font-size:22px;fill:#62758f}.head{font-size:28px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#62758f}.label{font-size:19px;font-weight:650;fill:#3769e8}.step{font-size:17px;letter-spacing:2px;font-weight:700;fill:#62758f}</style><rect width="1800" height="1790" fill="#fbfcff"/><text x="70" y="80" class="title">T19  원본 대조 게이트 · 증거에서 전환 전제조건까지</text><text x="70" y="125" class="sub">LLM 없이 규칙으로 판정한다. 결과 PASS와 운영 실행 승인은 분리한다.</text><rect x="70" y="180" width="470" height="150" rx="18" fill="#f4f6fa" stroke="#d8e1ee" stroke-width="2"/><text x="95" y="222" class="head">T14 · 출발지 ControlRun</text><text x="95" y="266" class="body">실행 결과·증거 참조</text><text x="95" y="301" class="body">원본 해시·방법·관측 시각</text><rect x="585" y="180" width="630" height="150" rx="18" fill="#f4f6fa" stroke="#d8e1ee" stroke-width="2"/><text x="610" y="222" class="head">T10 · 현재 계획과 서버 정본</text><text x="610" y="266" class="body">앱·환경 쌍·평가 프로필·계획 해시</text><text x="610" y="301" class="body">현재 권한·등록·예외 승인·보안 보류</text><rect x="1260" y="180" width="470" height="150" rx="18" fill="#f4f6fa" stroke="#d8e1ee" stroke-width="2"/><text x="1285" y="222" class="head">T14 · 목적지 ControlRun</text><text x="1285" y="266" class="body">실행 결과·증거 참조</text><text x="1285" y="301" class="body">원본 해시·방법·관측 시각</text><path d="M305 330 V360 H900 V395" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><path d="M900 330 V395" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><path d="M1495 330 V360 H900" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="395" width="1540" height="155" rx="18" fill="#f1f5ff" stroke="#3769e8" stroke-width="2"/><text x="160" y="436" class="step">01  증거의 유효성·결속 검사</text><text x="160" y="478" class="head">출처·서명 · 같은 앱·환경 쌍 · 계획·결과 해시 · 현재 권한·기한</text><text x="160" y="520" class="body">필수 시험 누락·중복·기대값 변경·방법 불일치·만료·다른 계획의 결과는 BLOCK</text><path d="M900 550 V605" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="605" width="960" height="270" rx="18" fill="#fff" stroke="#3769e8" stroke-width="2"/><text x="160" y="649" class="head">02  시험별 보호 수준 비교</text><text x="165" y="693" class="body">출발지</text><text x="495" y="693" class="body">목적지</text><text x="760" y="693" class="body">판정</text><text x="165" y="738" class="body">PASS</text><text x="495" y="738" class="body">PASS</text><text x="760" y="738" class="body">PASS</text><text x="165" y="778" class="body">FAIL</text><text x="495" y="778" class="body">PASS</text><text x="760" y="778" class="body">PASS · 개선</text><text x="165" y="818" class="body">PASS / FAIL</text><text x="495" y="818" class="body">FAIL</text><text x="760" y="818" class="body">BLOCK</text><text x="165" y="858" class="body">어느 한쪽 UNKNOWN</text><text x="495" y="858" class="body">—</text><text x="760" y="858" class="body">BLOCK</text><rect x="1160" y="605" width="510" height="270" rx="18" fill="#fff8ec" stroke="#ebc98e" stroke-width="2"/><text x="1190" y="649" class="head">서버 예외 승인 검증</text><text x="1190" y="694" class="body">TARGET_FAIL 행에만 적용</text><text x="1190" y="729" class="body">승인 ID·계획·시험·환경 결속</text><text x="1190" y="764" class="body">현재 권한·기간·폐기 상태 확인</text><text x="1190" y="799" class="body">UNKNOWN·증거 오류는 예외 불가</text><text x="1190" y="834" class="body">예외는 동등 PASS와 구분 표시</text><path d="M1090 740 H1160" fill="none" stroke="#a56512" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#amber)"/><path d="M900 875 V925" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="925" width="1540" height="145" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2"/><text x="160" y="967" class="step">03  T13 데이터 준비 상태와 결합</text><text x="160" y="1010" class="head">스키마·PK · 복제 지연 · 시퀀스 리허설 · 정확한 DB 쌍·신선도</text><text x="160" y="1047" class="small">T19 준비 판정은 T12/T13의 쓰기 정지 후 최종 데이터 비교를 대신하지 않는다.</text><path d="M900 1070 V1120" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="1120" width="1540" height="140" rx="18" fill="#f1f5ff" stroke="#3769e8" stroke-width="2"/><text x="160" y="1161" class="step">04  실제 소비 시점에 다시 확인</text><text x="160" y="1203" class="head">서버 정본 재조회 · 현재 승인·권한·키 폐기 · 증거·서명 만료</text><text x="160" y="1239" class="small">과거 PASS 재사용 금지 · 조회 실패·변경·불명확한 상태에서는 전제조건을 발급하지 않음</text><path d="M620 1260 V1310 H480 V1345" fill="none" stroke="#15845b" stroke-width="3" marker-end="url(#green)"/><path d="M1180 1260 V1310 H1320 V1345" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="130" y="1345" width="700" height="160" rx="18" fill="#eaf7f1" stroke="#a9d5c2" stroke-width="2"/><text x="160" y="1388" class="head" style="fill:#15845b">전제조건 충족</text><text x="160" y="1430" class="body">보안 + 데이터 준비를 모두 확인</text><text x="160" y="1468" class="small">authorizes_cutover = False · 실행 허가 아님</text><rect x="970" y="1345" width="700" height="160" rx="18" fill="#fff0f3" stroke="#e5b8c1" stroke-width="2"/><text x="1000" y="1388" class="head" style="fill:#bd4058">BLOCK · 호스트에서 보류</text><text x="1000" y="1430" class="body">불일치·미확인·만료·권한 문제</text><text x="1000" y="1468" class="small">수정·새 관측·재검증 필요 · 과거 PASS로 대체 금지</text><path d="M480 1505 V1555 H900 V1590" fill="none" stroke="#15845b" stroke-width="3" marker-end="url(#green)"/><rect x="130" y="1590" width="1540" height="110" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2"/><text x="160" y="1635" class="head">T10 · 현재 운영 승인·보류·실행 epoch를 같은 계획 잠금 안에서 결합</text><text x="160" y="1675" class="small">필수 조건을 모두 충족한 경우에만 T12/T31 실행 접수 · T19가 직접 배포하거나 쓰기를 열지 않음</text><text x="70" y="1750" class="small">구현 구조 · 실환경 열린 버킷 BLOCK 확인 · 스키마 불일치 BLOCK·수정 후 PASS의 전체 인수는 별도</text></svg>