<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1460" viewBox="0 0 1800 1460" role="img" aria-labelledby="title desc"><title id="title">T14  보안 통제 시험기 · 관측에서 증거까지</title><desc id="desc">AWS EKS와 온프레미스 RKE2를 같은 시험 ID·합격 기준으로 검사한다.</desc><defs><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#3769e8"/></marker><marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#15845b"/></marker><marker id="amber" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#a56512"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#172b4d}.title{font-size:43px;font-weight:750;letter-spacing:-1px}.sub{font-size:22px;fill:#62758f}.head{font-size:28px;font-weight:700}.body{font-size:23px}.small{font-size:20px;fill:#62758f}.label{font-size:19px;font-weight:650;fill:#3769e8}.step{font-size:17px;letter-spacing:2px;font-weight:700;fill:#62758f}</style><rect width="1800" height="1460" fill="#fbfcff"/><text x="70" y="80" class="title">T14  보안 통제 시험기 · 관측에서 증거까지</text><text x="70" y="125" class="sub">AWS EKS와 온프레미스 RKE2를 같은 시험 ID·합격 기준으로 검사한다.</text><rect x="70" y="175" width="1660" height="115" rx="18" fill="#f4f6fa" stroke="#d8e1ee" stroke-width="2"/><text x="100" y="215" class="step">INPUT  ·  T5 시험 계약 + T10의 현재 등록</text><text x="100" y="255" class="body">평가 프로필·필수 시험·방법 버전  /  앱·환경·자원·실행 주체·허용 범위</text><path d="M900 290 V340" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="280" y="340" width="1240" height="145" rx="18" fill="#f1f5ff" stroke="#3769e8" stroke-width="2"/><text x="310" y="381" class="step">01  서버가 등록한 시험 실행</text><text x="310" y="423" class="head">Runner · 공통 실행·결과 계약</text><text x="310" y="461" class="body">실행 ID 생성 · 등록 일치 확인 · 신뢰된 어댑터 선택 · 시간·대상 범위 제한</text><path d="M610 485 V525 H460 V565" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><path d="M1190 485 V525 H1340 V565" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><text x="72" y="535" class="label">시험 요청</text><rect x="70" y="565" width="780" height="310" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2" stroke-dasharray="9 7"/><text x="100" y="605" class="step">AWS / SOURCE</text><text x="100" y="649" class="head">출발지 · AWS EKS</text><path d="M100 670 H820" stroke="#d8e1ee"/><text x="100" y="715" class="body">Secret 접근: Secrets Manager + 역할 대조</text><text x="100" y="753" class="body">객체 접근: S3 정상·익명 GET</text><text x="100" y="791" class="body">TLS·네트워크: PgBouncer / PostgreSQL</text><text x="100" y="829" class="body">감사: 등록된 로그 원천에서 카나리 검색</text><rect x="950" y="565" width="780" height="310" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2" stroke-dasharray="9 7"/><text x="980" y="605" class="step">ON-PREMISES / TARGET</text><text x="980" y="649" class="head">목적지 · 온프레미스 RKE2</text><path d="M980 670 H1700" stroke="#d8e1ee"/><text x="980" y="715" class="body">Secret 접근: OpenBao + 서비스 계정 대조</text><text x="980" y="753" class="body">객체 접근: SeaweedFS 정상·익명 GET</text><text x="980" y="791" class="body">TLS·네트워크: PgBouncer / PostgreSQL</text><text x="980" y="829" class="body">감사: 등록된 로그 원천에서 카나리 검색</text><path d="M460 875 V915 H900 V960" fill="none" stroke="#15845b" stroke-width="3" marker-end="url(#green)"/><path d="M1340 875 V915 H900" fill="none" stroke="#15845b" stroke-width="3" marker-end="url(#green)"/><text x="1120" y="943" class="small">관측 결과 + 정상 대조군</text><rect x="160" y="960" width="1480" height="135" rx="18" fill="#f1f5ff" stroke="#3769e8" stroke-width="2"/><text x="190" y="1001" class="step">02  공통 규칙으로 결과 판정</text><text x="190" y="1045" class="head">PASS  기대와 일치     FAIL  기대와 불일치     UNKNOWN  미실행·관찰 불가</text><text x="190" y="1079" class="small">대조군 실패·미등록 도구·오류·시간 초과를 PASS로 처리하지 않는다.</text><path d="M900 1095 V1145" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="160" y="1145" width="1480" height="135" rx="18" fill="#fff" stroke="#d8e1ee" stroke-width="2"/><text x="190" y="1186" class="step">03  ControlRun + 증거 원문 보존</text><text x="190" y="1228" class="body">시험 ID · 관찰값 · 방법 · 시각·만료 · 원본 해시 · 앱·환경·실행 ID</text><text x="190" y="1264" class="small">호스트가 접근 통제된 저장소에 보존하며 비밀 값은 결과에 남기지 않는다.</text><path d="M900 1280 V1325" fill="none" stroke="#3769e8" stroke-width="3" marker-end="url(#blue)"/><rect x="510" y="1325" width="780" height="60" rx="18" fill="#eaf7f1" stroke="#b5dccb" stroke-width="2"/><text x="900" y="1363" class="body" text-anchor="middle">T19에 불변 결과 참조 전달 → 양쪽 비교·판정</text><text x="70" y="1421" class="small">구현 구조 · 어댑터별 실환경 검증 범위는 별도 표 참조 · 20행 생성 ≠ 20개 시험 수행</text></svg>